name: CI 313553015

on:
  push:

jobs:
  ci:
    name: Typecheck, Format & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        if: always()
        run: npm run typecheck

      - name: Prettier check
        if: always()
        run: |
          OUTPUT=$(NO_COLOR=1 npm run format:check 2>&1) || EXIT_CODE=$?
          if [ -n "$EXIT_CODE" ]; then
            echo "### ❌ Prettier 格式檢查失敗" >> $GITHUB_STEP_SUMMARY
            echo "請在本地執行 \`npm run format\` 或 \`npm run lint:fix\` 來自動修復以下問題：" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Run tests
        if: always()
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/vitest-junit.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/vitest-junit.xml
          check_name: 'Test Results'
